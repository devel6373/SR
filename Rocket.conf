DOMAIN-SUFFIX,ytimg.com,AUTO,force-remote-dns
DOMAIN-SUFFIX,youtube.com,AUTO,force-remote-dns
DOMAIN-SUFFIX,youtu.be,AUTO,force-remote-dns
