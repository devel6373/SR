RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/YouTubeMusic/YouTubeMusic.list,AUTO,force-remote-dns

# ── 7. Голос / видеозвонки (портовые правила) ──
